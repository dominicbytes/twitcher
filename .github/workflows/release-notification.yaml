name: Notify on Release
on:
  release:
    types: [ published ]
jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
    - name: Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # master as of 2026-10-18
      with:
        args: 'Twitcher {{ EVENT_PAYLOAD.release.name }} got released. \n {{ EVENT_PAYLOAD.release.body }} \n\n 
        [Get it here]({{ EVENT_PAYLOAD.release.assets_url }})'
